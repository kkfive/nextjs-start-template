name: Docker Images

on:
  workflow_dispatch:
    inputs:
      services:
        description: 要构建的服务；all 表示全部服务
        required: true
        default: all
        type: choice
        options:
          - all
          - client
          - admin
          - api
      image_tag:
        description: 镜像标签；留空时使用提交 SHA
        required: false
        type: string
      push:
        description: 构建后推送到阿里云容器镜像服务
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-images:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: ${{ inputs.push && 'registry.cn-beijing.aliyuncs.com/xk-repo' || 'local' }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://docker-build.invalid' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://docker-build.invalid' }}
      API_BUILD_BASE_URL: ${{ vars.API_BUILD_BASE_URL || 'http://docker-build.invalid' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 校验前端构建变量
        if: inputs.services == 'all' || inputs.services == 'client' || inputs.services == 'admin'
        shell: bash
        env:
          CONFIG_NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          CONFIG_NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          CONFIG_API_BUILD_BASE_URL: ${{ vars.API_BUILD_BASE_URL }}
        run: |
          test -n "$CONFIG_NEXT_PUBLIC_API_URL" || {
            echo "缺少 Repository Variable：NEXT_PUBLIC_API_URL" >&2
            exit 1
          }

          if [ "${{ inputs.services }}" = "all" ] || [ "${{ inputs.services }}" = "client" ]; then
            test -n "$CONFIG_NEXT_PUBLIC_APP_URL" || {
              echo "缺少 Repository Variable：NEXT_PUBLIC_APP_URL" >&2
              exit 1
            }
            test -n "$CONFIG_API_BUILD_BASE_URL" || {
              echo "缺少 Repository Variable：API_BUILD_BASE_URL" >&2
              exit 1
            }
          fi

      - name: 校验阿里云镜像仓库凭证
        if: inputs.push
        shell: bash
        env:
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        run: |
          test -n "$ALIYUN_DOCKER_USERNAME" || {
            echo "缺少 Secret：ALIYUN_DOCKER_USERNAME" >&2
            exit 1
          }
          test -n "$ALIYUN_DOCKER_PASSWORD" || {
            echo "缺少 Secret：ALIYUN_DOCKER_PASSWORD" >&2
            exit 1
          }

      - name: 登录阿里云容器镜像服务
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: 构建全部镜像
        if: inputs.services == 'all'
        run: docker compose build

      - name: 构建指定镜像
        if: inputs.services != 'all'
        run: docker compose build "${{ inputs.services }}"

      - name: 推送全部镜像
        if: inputs.push && inputs.services == 'all'
        run: docker compose push

      - name: 推送指定镜像
        if: inputs.push && inputs.services != 'all'
        run: docker compose push "${{ inputs.services }}"

      - name: 输出镜像信息
        run: |
          echo "镜像仓库：$IMAGE_REGISTRY"
          echo "镜像标签：$IMAGE_TAG"
          echo "构建服务：${{ inputs.services }}"
          echo "是否推送：${{ inputs.push }}"
