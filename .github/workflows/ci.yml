name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # 全量执行：全局一致性检查不用 affected filter（见 .agents/rules/monorepo.rule.md）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm verify
        run: pnpm verify

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve turbo filter（PR 跑受影响包 / push 全量）
        id: turbo
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" 2>/dev/null || true
            echo "filter=...[origin/$BASE_REF]" >> "$GITHUB_OUTPUT"
          else
            echo "filter=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: |
          if [ -n "${{ steps.turbo.outputs.filter }}" ]; then
            pnpm exec turbo run test:run --filter="${{ steps.turbo.outputs.filter }}"
          else
            pnpm test:run
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [verify, test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve turbo filter（PR 跑受影响包 / push 全量）
        id: turbo
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" 2>/dev/null || true
            echo "filter=...[origin/$BASE_REF]" >> "$GITHUB_OUTPUT"
          else
            echo "filter=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          if [ -n "${{ steps.turbo.outputs.filter }}" ]; then
            pnpm exec turbo run build --filter="${{ steps.turbo.outputs.filter }}"
          else
            pnpm build
          fi
        env:
          SKIP_ENV_VALIDATION: true
          # 构建期即求值 getBaseUrl()（http-server.ts），生产构建必须提供 NEXT_PUBLIC_APP_URL；
          # 与 docker-images.yml 一致，允许用仓库变量覆盖兜底值
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://docker-build.invalid' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://docker-build.invalid' }}
          # rpc-server.ts 构建期即求值 getRpcBaseUrl()，同样必需（Dockerfile 中亦为必填 ARG）
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://docker-build.invalid' }}
