# Single source of truth for create-app task routing.
# SKILL.md Common Tasks 表必须与本文件保持一致。

tasks:
  - intent: 新建应用
    triggers: ["新建 app", "新建应用", "新建 client", "新建 admin", "新建 api"]
    route:
      - workflows/new-app.md
      - references/app-anatomy.md

  - intent: app 结构与配置继承
    triggers: ["tsconfig 继承", "next.config", "eslint 继承", "目录结构"]
    route:
      - references/app-anatomy.md

  - intent: 注入 HttpService / 接入 domain-core
    triggers: ["HttpService", "注入实例", "domain-core", "service 实例"]
    route:
      - references/app-anatomy.md

  - intent: 踩坑
    triggers: ["transpilePackages", "配置未继承", "注入错实例", "app 互引"]
    route:
      - references/gotchas.md
