# Single source of truth for hono-api task routing.
# SKILL.md Common Tasks 表必须与本文件保持一致。

tasks:
  - intent: 新建 Hono 路由端点
    triggers: ["新建路由", "新增端点", "Hono route", "API 接口"]
    trigger_examples:
      - "帮我新建一个 GET /users 的路由"
      - "加一个 POST 接口端点"
      - "用 Hono 写一个 API 接口"
    route:
      - workflows/new-route.md
      - references/schema-validation.md

  - intent: 新增中间件
    triggers: ["中间件", "middleware", "认证", "CORS", "日志"]
    trigger_examples:
      - "加一个认证中间件"
      - "怎么配置 CORS"
      - "帮我加个请求日志中间件"
    route:
      - workflows/add-middleware.md

  - intent: schema 校验请求
    triggers: ["zod", "校验", "validate", "请求体", "@kkfive/contracts"]
    trigger_examples:
      - "用 zod 校验请求体参数"
      - "接口入参怎么 validate"
      - "从 @kkfive/contracts 引入 schema 做校验"
    route:
      - references/schema-validation.md

  - intent: 路由调用 domain-core
    triggers: ["调用 controller", "同进程直调", "domain-core"]
    trigger_examples:
      - "路由里怎么调用 domain-core 的 controller"
      - "同进程直调 controller 怎么写"
      - "Hono 路由要直接调业务逻辑"
    route:
      - references/domain-direct-call.md

  - intent: 踩坑
    triggers: ["报错", "路由不生效", "中间件顺序", "BFF 还是后端"]
    trigger_examples:
      - "路由配了但是不生效"
      - "中间件执行顺序不对"
      - "这个该算 BFF 还是后端"
    route:
      - references/gotchas.md
