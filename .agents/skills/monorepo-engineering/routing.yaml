# Single source of truth for monorepo-engineering task routing.

tasks:
  - intent: 优化构建缓存 / 排查 cache miss
    triggers: ["缓存", "cache", "stale", "turbo", "构建慢", "命中率"]
    trigger_examples:
      - "构建缓存命中率低，怎么优化"
      - "改了 .env 但 build 没重跑，是不是 stale cache"
      - "turbo.json 怎么配置 inputs 和 outputs"
    route: [workflows/optimize-turbo-cache.md]

  - intent: CI 只跑受影响包
    triggers: ["affected", "CI", "增量", "filter", "受影响"]
    trigger_examples:
      - "CI 每次全量跑太慢，配置 affected"
      - "怎么让 CI 只构建改动的包"
      - "turbo --filter 怎么用在 GitHub Actions"
    route: [workflows/setup-ci-affected.md]

  - intent: 单向依赖机器校验
    triggers: ["依赖方向", "G07", "单向依赖", "跨包 import", "verify-conventions"]
    trigger_examples:
      - "怎么自动检测 packages 误 import apps"
      - "给 verify-conventions 加一条依赖方向校验"
      - "单向依赖规则怎么机器化"
    route: [workflows/enforce-dependency-direction.md]

  - intent: turbo.json v2 配置参考
    triggers: ["turbo.json", "tasks", "pipeline", "v2 配置"]
    trigger_examples:
      - "turbo.json 的 tasks 怎么写"
      - "v1 的 pipeline 在 v2 改成什么了"
    route: [references/turbo-v2-config.md]

  - intent: 踩坑速查
    triggers: ["pipeline", "预构建", "tsup", "dist", "stale", "affected 全局"]
    trigger_examples:
      - "外部 skill 用 pipeline，我们该用吗"
      - "要不要给 packages 加 tsup 预构建"
      - "为什么改环境变量 build 不重跑"
    route: [references/gotchas.md]
