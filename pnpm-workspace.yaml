minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
autoInstallPeers: false

peerDependencyRules:
  ignoreMissing:
    - '@typescript-eslint/rule-tester'
    - '@vue/compiler-sfc'

strictPeerDependencies: true
shellEmulator: true

packages:
  - 'apps/*'
  - 'packages/*'
  - 'internal/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  msw: true
  sharp: true
  unrs-resolver: true
  workerd: true

